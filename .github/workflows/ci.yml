name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pyright
        run: pyright

      - name: Pip audit
        if: github.event_name != 'pull_request'
        run: pip-audit

      - name: Pytest
        run: pytest -q

  required-pr-ci:
    name: required-pr-ci
    if: ${{ always() }}
    needs:
      - dependency-review
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Validate required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail

          echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"
          echo "test=$TEST_RESULT"

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "The test matrix did not complete successfully."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency review did not complete successfully."
            exit 1
          fi

          echo "All required PR checks completed successfully."
