[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transtools"
version = "0.2.1"
description = "Desktop toolkit for transition support: voice, medication, habits and reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Alejandro Mata Ali"}
]
keywords = ["voice", "tracking", "transition", "pitch", "audio", "gui", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Tk",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=2.4.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "sounddevice>=0.4.6",
    "librosa>=0.10.0",
    "soundfile>=0.14.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "pillow>=12.3.0",
    "tkcalendar>=1.6.1",
    "reportlab>=5.0.0",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[project.scripts]
transtools = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bootstrap_cli", "main", "i18n"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
fixable = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "output", ".pytest_tmp", ".ruff_cache", ".pytest_cache"]
addopts = "-p no:cacheprovider"
